<svg xmlns="http://www.w3.org/2000/svg" width="640" height="360" viewBox="0 0 640 360" role="img" aria-label="Python 入门 封面">
  <!-- 喵站 · Python 教程封面。纯代码绘制，无外部依赖。
       底色沿用站内示意图的妃色纸面 + 品牌粉。
       左侧图形是 Python 官方 logo：© Python Software Foundation，
       取自 python.org/static/community_logos/python-logo-generic.svg（CC-BY 3.0），
       仅用于指代 Python 这门语言本身，不代表官方出品或背书。
       两条 path 原样保留，外面套 translate(69.011,81.8) scale(1.25) 放进左半区
       （蛇身原 bbox 111.16×112.39 → 落位 x 76.0~215.0 / y 89.8~230.3，与右侧卡片留 17px）。 -->
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#fffdf9"/>
      <stop offset="1" stop-color="#fbeef4"/>
    </linearGradient>
    <linearGradient id="pyb" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#5a9fd4"/>
      <stop offset="1" stop-color="#306998"/>
    </linearGradient>
    <linearGradient id="pyy" x1="0" y1="1" x2="1" y2="0">
      <stop offset="0" stop-color="#ffd43b"/>
      <stop offset="1" stop-color="#ffe873"/>
    </linearGradient>
    <!-- 卡片顶部那条蓝色强调线要贴着圆角裁掉，否则会从 rx=14 的圆角外翘出去 -->
    <clipPath id="cardClip">
      <rect x="232" y="72" width="376" height="150" rx="14"/>
    </clipPath>
  </defs>

  <rect width="640" height="360" fill="url(#bg)"/>
  <!-- 网格底纹：暗示代码编辑器 -->
  <g stroke="#e3b6c8" stroke-opacity=".55">
    <path d="M0 60H640M0 120H640M0 180H640M0 240H640M0 300H640"/>
    <path d="M80 0V360M160 0V360M240 0V360M320 0V360M400 0V360M480 0V360M560 0V360"/>
  </g>

  <!-- Python 官方 logo（两条蛇形 path 原样） -->
  <g transform="translate(69.011,81.8) scale(1.25)">
    <path fill="url(#pyb)" fill-opacity="1" d="M 60.510156,6.3979729 C 55.926503,6.4192712 51.549217,6.8101906 47.697656,7.4917229 C 36.35144,9.4962267 34.291407,13.691825 34.291406,21.429223 L 34.291406,31.647973 L 61.103906,31.647973 L 61.103906,35.054223 L 34.291406,35.054223 L 24.228906,35.054223 C 16.436447,35.054223 9.6131468,39.73794 7.4789058,48.647973 C 5.0170858,58.860939 4.9078907,65.233996 7.4789058,75.897973 C 9.3848341,83.835825 13.936449,89.491721 21.728906,89.491723 L 30.947656,89.491723 L 30.947656,77.241723 C 30.947656,68.391821 38.6048,60.585475 47.697656,60.585473 L 74.478906,60.585473 C 81.933857,60.585473 87.885159,54.447309 87.885156,46.960473 L 87.885156,21.429223 C 87.885156,14.162884 81.755176,8.7044455 74.478906,7.4917229 C 69.872919,6.7249976 65.093809,6.3766746 60.510156,6.3979729 z M 46.010156,14.616723 C 48.779703,14.616723 51.041406,16.915369 51.041406,19.741723 C 51.041404,22.558059 48.779703,24.835473 46.010156,24.835473 C 43.23068,24.835472 40.978906,22.558058 40.978906,19.741723 C 40.978905,16.91537 43.23068,14.616723 46.010156,14.616723 z"/>
    <path fill="url(#pyy)" fill-opacity="1" d="M 91.228906,35.054223 L 91.228906,46.960473 C 91.228906,56.191228 83.403011,63.960472 74.478906,63.960473 L 47.697656,63.960473 C 40.361823,63.960473 34.291407,70.238956 34.291406,77.585473 L 34.291406,103.11672 C 34.291406,110.38306 40.609994,114.65704 47.697656,116.74172 C 56.184987,119.23733 64.323893,119.68835 74.478906,116.74172 C 81.229061,114.78733 87.885159,110.85411 87.885156,103.11672 L 87.885156,92.897973 L 61.103906,92.897973 L 61.103906,89.491723 L 87.885156,89.491723 L 101.29141,89.491723 C 109.08387,89.491723 111.98766,84.056315 114.69765,75.897973 C 117.49698,67.499087 117.37787,59.422197 114.69765,48.647973 C 112.77187,40.890532 109.09378,35.054223 101.29141,35.054223 L 91.228906,35.054223 z M 76.166406,99.710473 C 78.945884,99.710476 81.197656,101.98789 81.197656,104.80422 C 81.197654,107.63057 78.945881,109.92922 76.166406,109.92922 C 73.396856,109.92922 71.135156,107.63057 71.135156,104.80422 C 71.135158,101.98789 73.396853,99.710473 76.166406,99.710473 z"/>
  </g>

  <!-- 右侧：编辑器小卡片，>>> 提示符 + 一行循环。卡片右缘 608，留在 640 画布内 -->
  <rect x="232" y="72" width="376" height="150" rx="14" fill="#ffffff" stroke="#f0cfdb"/>
  <rect x="232" y="72" width="376" height="5" fill="#3776ab" fill-opacity=".45" clip-path="url(#cardClip)"/>
  <g transform="translate(248,124)" font-family="JetBrains Mono, SFMono-Regular, Consolas, monospace">
    <text x="12" y="0" font-size="34" font-weight="700" fill="#fb7da8">&gt;&gt;&gt;</text>
    <text x="82" y="0" font-size="34" font-weight="700" fill="#33333a">print()</text>
    <rect x="230" y="-24" width="11" height="28" rx="2" fill="#fb7da8"/>
    <text x="12" y="44" font-size="16" fill="#96909b">for lesson in range(1, 46):</text>
    <!-- 缩进必须保住：SVG 默认会折叠前导空格，得显式 preserve -->
    <text x="12" y="68" font-size="16" fill="#96909b" xml:space="preserve">    learn(lesson)</text>
  </g>

  <!-- 字标 -->
  <g font-family="Inter, PingFang SC, HarmonyOS Sans SC, Microsoft YaHei, sans-serif">
    <text x="74" y="292" font-size="46" font-weight="800" fill="#2c2a2e" letter-spacing="1">Python</text>
    <text x="252" y="292" font-size="30" font-weight="600" fill="#3776ab">入门</text>
    <text x="74" y="326" font-size="15" fill="#8c8794" letter-spacing="2">45 课 · 零基础 · 每课都能直接跑</text>
  </g>
  <g transform="translate(556,272)">
    <rect x="0" y="0" width="58" height="26" rx="13" fill="#fb7da8" fill-opacity=".14" stroke="#fb7da8" stroke-opacity=".55"/>
    <text x="29" y="18" text-anchor="middle" font-size="14" font-weight="700" fill="#e0578b"
          font-family="Inter, PingFang SC, sans-serif">v3</text>
  </g>
</svg>
