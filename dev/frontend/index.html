<!DOCTYPE html>
<html lang="zh-CN" data-theme="light">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>喵站 · 简单学编程喵~</title>
  <meta name="description" content="喵站：体系化图文教程，不用注册不用登录，课末考试与代码运行都在浏览器里完成，内容永久免费。双击 index.html 就能开，任何静态托管都能上。">
  <script src="assets/js/theme-boot.js"></script>
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Ccircle cx='16' cy='16' r='15' fill='%23e75490'/%3E%3Ctext x='16' y='21' font-size='14' text-anchor='middle' fill='white' font-family='sans-serif' font-weight='bold'%3E%E5%96%B5%3C/text%3E%3C/svg%3E">
  <link rel="stylesheet" href="assets/css/style.css">
</head>
<body>
  <header class="nav">
    <div class="nav-inner">
      <a class="logo" href="#/"><b>喵站</b><span>MIAO&nbsp;DEV</span></a>
      <nav class="nav-links">
        <a href="#/">首页</a>
        <!-- 视频已经建了页面（#/video 列表 + #/video/<id> 播放页），剩下三个还是只挂入口：
             点了给一句到位的提示，不留死链，也不假装有内容。
             用 <a> 而不是 <button>，样式跟「首页」完全同源；点击在 app.js 里拦下来。 -->
        <a href="#/video" id="navVideo">视频</a>
        <a href="#/" class="nav-soon" data-soon="考试">考试</a>
        <a href="#/" class="nav-soon" data-soon="幻灯片">幻灯片</a>
        <a href="#/" class="nav-soon" data-soon="终生学习">终生学习</a>
      </nav>
      <div class="nav-search">
        <input id="navSearch" type="search" placeholder="搜索教程 / 章节标题 / 作者，回车搜索" aria-label="搜索">
      </div>
      <!-- 右上角只有一个齿轮：公告、主题、字号 -->
      <div class="nav-right" id="navRight"></div>
    </div>
  </header>

  <main id="app"></main>

  <footer>
    <div class="container">
      <span>© 2026 喵站 Miao · 开源教程站，内容永久免费</span>
      <!-- 页脚这两颗一直在：「加入我们」（原「成为老师」）与「赞助」。
           各开各的弹层，不弹进通用设置（那两栏在面板里也留着，是另一条路）。
           用 button 不用 a：它开的是弹层，不是路由，不该有地址。 -->
      <button class="foot-link" id="joinBtn" type="button">加入我们</button>
      <button class="foot-link" id="sponsorBtn" type="button">赞助</button>
    </div>
  </footer>

  <div id="joinPop" class="hidden"></div>
  <div id="sponsorPop" class="hidden"></div>

  <div id="toast"></div>

  <!-- ── 首屏就这五份 js：176 KB（gzip 57 KB），纯静态、无后端、不拉服务 ──────────
       site.js   登记清单：每门课的骨架是哪几份、考场用哪套引擎
       index.js  目录：课程元信息 + 每章标题 + 骨架(boot)与「这一章的正文在哪个文件」(chunks)
       data.js   本地数据层 + 分层加载器
       app.js    视图与路由
       正文、题库、沙箱、音频一律不在这里：<script> 由 data.js 在「点开那一章」时注入。
       视频那两份（videos.js 数据 + video-ui.js 界面）同理，点导航「视频」才注入；
       mp4 与封面更不在这里 —— 那是 <video>/<img> 按人有没有真点开自己拉的。
       谁把 assets/data/*.js 往这里补一行，首屏就退回 4 MB —— 加课请改 site.js 再跑 gen-index.js。 -->
  <script src="assets/data/site.js"></script>
  <script src="assets/data/index.js"></script>
  <script src="assets/js/data.js"></script>
  <script src="assets/js/app.js"></script>
</body>
</html>
