# 喵站 · Nginx 反代配置示例
#
# 放到 /etc/nginx/sites-available/miao 并软链到 sites-enabled/，或并入 conf.d/。
# 用法：把 miao.example.com 换成你自己的域名。
#
# 生效前提：
#   1) 后端 host 保持 127.0.0.1（默认值），只允许反代访问
#   2) 在 dev/backend/.env 里设 MIAO_TRUST_PROXY=true
#      —— 这样后端才能从 X-Forwarded-For 拿到访客真实 IP，限流/封禁才有效
#
# 改完执行：nginx -t && systemctl reload nginx

# ── 前台 + API（8787）────────────────────────────────────────────
server {
    listen 80;
    listen [::]:80;
    server_name miao.example.com;

    # 写操作请求体上限：后端 8MB（图片上传），这里留点余量
    client_max_body_size 12m;

    # 安全响应头由后端下发，这里不重复设置

    location / {
        proxy_pass http://127.0.0.1:8787;
        proxy_http_version 1.1;

        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # 慢连接防护
        proxy_connect_timeout 5s;
        proxy_read_timeout    60s;
        proxy_send_timeout    60s;
    }

    # 上传的图片是内容哈希命名，可长缓存
    location /uploads/ {
        proxy_pass http://127.0.0.1:8787;
        proxy_set_header Host $host;
        expires 1y;                 # 会下发 Cache-Control: max-age=31536000
    }
}

# ── 后台管理系统（8788）──────────────────────────────────────────
# 强烈建议：不要直接把 8788 裸露在公网。
# 这里用「独立子域 + Basic Auth」双保险，管理口令之外再加一层门。
#
# 生成 .htpasswd：
#   sudo apt-get install -y apache2-utils
#   sudo htpasswd -c /etc/nginx/.htpasswd-miao 你的用户名
server {
    listen 80;
    listen [::]:80;
    server_name admin.miao.example.com;

    # 也可以再收紧成只允许你自己的固定 IP：
    # allow 1.2.3.4;
    # deny  all;

    auth_basic           "miao admin";
    auth_basic_user_file /etc/nginx/.htpasswd-miao;

    location / {
        proxy_pass http://127.0.0.1:8788;
        proxy_http_version 1.1;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}

# ── 配好域名后加 HTTPS（推荐）───────────────────────────────────
#   sudo apt-get install -y certbot python3-certbot-nginx
#   sudo certbot --nginx -d miao.example.com -d admin.miao.example.com
# certbot 会自动改写上面的 server 块并加 443 与自动续期定时器。
#
# 注意：中国大陆的服务器若用域名对外提供 80/443 服务，按法规需要 ICP 备案；
#      只用 IP 直连、或部署在境外节点则不受此限制。
